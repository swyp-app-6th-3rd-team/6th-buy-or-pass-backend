# 관측성 백엔드 — 독립 스택
#
# 이 스택은 앱과 수명주기를 공유하지 않는다. 한 번 띄우고 계속 둔다.
#
#   docker network create observability-net     # 최초 1회
#   docker compose -f observability/docker-compose.yml up -d
#
# 왜 앱 compose 에 합치지 않는가:
#   - 앱을 down 하면 백엔드까지 내려가 다른 앱의 트레이스가 끊긴다
#   - 앱마다 백엔드를 띄우면 홈서버가 감당하지 못한다
#   - 여러 앱을 한 화면에서 보는 것이 이 스택의 존재 이유다
#
# 앱은 external 네트워크에 참여해 collector 로 보낸다.
# 앱 리포지토리의 docker-compose-otel.yml 참조.
#
# 전 컴포넌트 arm64 네이티브다(Pinpoint 의 HBase 같은 구멍이 없다).

services:
  # ── OTel Collector — 앱의 단일 진입점 ──────────────────────────────────
  # 앱은 이 주소 하나만 안다. 백엔드를 갈아끼워도 앱 설정이 안 바뀐다(락인 회피).
  # 트레이스·메트릭·로그를 모두 받아 각 백엔드로 분배한다.
  # (Promtail 은 레거시다 — 2026 기준 Alloy 또는 Collector 를 쓴다)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.139.0
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      # 호스트에서 직접 실행하는 앱(IDE 기동)을 위해 노출한다.
      # 컨테이너 앱은 같은 네트워크라 서비스명으로 접근하므로 노출이 필수는 아니다.
      - "${OTEL_GRPC_PORT:-4317}:4317"   # OTLP gRPC
      - "${OTEL_HTTP_PORT:-4318}:4318"   # OTLP HTTP
    depends_on:
      - tempo
      - loki
    # 컨테이너 하나가 폭주해 호스트를 마비시키는 것을 막는다.
    # 홈서버 사양에 맞춰 조정한다(docs/observability-deployment.md §3-3).
    mem_limit: 512M
    networks:
      - observability-net

  # ── Tempo — 트레이스 저장 + service graph 생성 ─────────────────────────
  # metrics-generator 가 span 을 읽어 service graph / span metrics 를 만들고
  # Prometheus 로 remote-write 한다. 이것이 Pinpoint ServerMap 의 대체물이다.
  tempo:
    image: grafana/tempo:2.9.0
    container_name: tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo-config.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    # 컨테이너 하나가 폭주해 호스트를 마비시키는 것을 막는다.
    # 홈서버 사양에 맞춰 조정한다(docs/observability-deployment.md §3-3).
    mem_limit: 1G
    networks:
      - observability-net

  # ── Prometheus — 메트릭 + service graph 저장 ───────────────────────────
  # Tempo 의 remote-write 를 받아야 하므로 receiver 를 켠다.
  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-15d}
      # Tempo metrics-generator 가 remote-write 로 밀어넣는다.
      - --web.enable-remote-write-receiver
      # exemplar = 메트릭에서 트레이스로 점프하는 연결고리.
      - --enable-feature=exemplar-storage
    volumes:
      - ./prometheus-config.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus_data:/prometheus
    # 컨테이너 하나가 폭주해 호스트를 마비시키는 것을 막는다.
    # 홈서버 사양에 맞춰 조정한다(docs/observability-deployment.md §3-3).
    mem_limit: 1G
    networks:
      - observability-net

  # ── Loki — 로그 ────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.5.7
    container_name: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki-config.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    # 컨테이너 하나가 폭주해 호스트를 마비시키는 것을 막는다.
    # 홈서버 사양에 맞춰 조정한다(docs/observability-deployment.md §3-3).
    mem_limit: 1G
    networks:
      - observability-net

  # ── Grafana — UI ───────────────────────────────────────────────────────
  # datasource 와 대시보드를 provisioning 으로 자동 로드한다.
  # 수동 설정을 요구하지 않는다 — 템플릿이므로 띄우면 바로 보여야 한다.
  grafana:
    image: grafana/grafana:12.3.1
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - tempo
      - prometheus
      - loki
    ports:
      # 앱이 8080 을 쓰므로 3000 을 그대로 쓴다.
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      # 익명 열람. **기본값이 false 다** — 켜는 것은 의식적 선택이어야 한다.
      # 로컬에서 빠르게 훑어볼 때만 .env 에서 true 로 바꾼다.
      # 홈서버 배포 시 하드닝은 docs/observability-deployment.md §3-1 참조.
      - GF_AUTH_ANONYMOUS_ENABLED=${GRAFANA_ANONYMOUS:-false}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      # trace ↔ log ↔ metric 상호 이동에 필요하다.
      - GF_FEATURE_TOGGLES_ENABLE=traceToMetrics
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    # 컨테이너 하나가 폭주해 호스트를 마비시키는 것을 막는다.
    # 홈서버 사양에 맞춰 조정한다(docs/observability-deployment.md §3-3).
    mem_limit: 512M
    networks:
      - observability-net

volumes:
  tempo_data:
    name: observability-tempo-data
  prometheus_data:
    name: observability-prometheus-data
  loki_data:
    name: observability-loki-data
  grafana_data:
    name: observability-grafana-data

networks:
  # external — 앱 스택이 같은 네트워크에 참여해 collector 로 보낸다.
  # 최초 1회: docker network create observability-net
  observability-net:
    external: true
    name: observability-net
