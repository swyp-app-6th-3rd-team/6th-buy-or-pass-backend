# Prometheus — 메트릭 저장 + Tempo service graph 수신
#
# 두 경로로 데이터가 들어온다.
#   1) scrape (pull)        — 앱의 /actuator/prometheus 를 직접 긁는다
#   2) remote-write (push)  — Tempo metrics-generator 의 service graph / span metrics

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # 애플리케이션 메트릭.
  #
  # 앱은 관리 포트(9090)를 별도로 열어 /actuator/prometheus 를 노출한다.
  # 서비스 포트(8080)가 아니라 관리 포트를 쓰는 이유는, 메트릭이 인증 없이
  # 열려야 하는데 SecurityConfig 의 PUBLIC_GET 에 넣으면 JVM·DB 내부 지표가
  # 외부에 공개되기 때문이다. 관리 포트는 compose 네트워크 안에만 있다.
  #
  # 여러 앱을 추가할 때는 targets 에 한 줄씩 더한다.
  - job_name: spring-boot-apps
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "sakila-app:9090"
        labels:
          application: sakila-ddd-template
    # 앱이 안 떠 있어도 Prometheus 는 정상 동작한다(타겟만 down 표시).
    honor_labels: true
