# Tempo — 트레이스 저장 + service graph 생성
#
# metrics_generator 가 span 을 읽어 service graph 와 span metrics 를 만들고
# Prometheus 로 remote-write 한다. **이것이 Pinpoint ServerMap 의 대체물이다.**
#
# 한계(알고 쓸 것):
#   - 계측되지 않은 호출자는 "user" 로 뭉뚱그려진다
#   - 샘플링하면 엣지 카운트가 과소 집계된다(Pinpoint 는 에이전트 측에서 세므로 정확)
#     → 이 프로젝트는 샘플링 100% 이므로 해당 없음

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    # 주의: 이 파일은 ${VAR} 를 확장하지 않는다(compose 가 아니라 Tempo 가 읽는다).
    # 값을 바꾸려면 여기를 직접 고친다.
    block_retention: 168h   # 7일

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces
  processor:
    service_graphs:
      # 계측 안 된 상대 노드에 이름을 붙인다.
      # (Collector 의 servicegraph 커넥터는 이 설정이 없어 항상 "user" 다 —
      #  그래서 Collector 가 아니라 Tempo 에서 생성한다)
      peer_attributes: [db.name, db.system, server.address, net.peer.name]
    span_metrics:
      dimensions: [http.request.method, http.response.status_code, db.system]

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      # service-graphs = ServerMap 대체, span-metrics = RED 지표
      processors: [service-graphs, span-metrics]
