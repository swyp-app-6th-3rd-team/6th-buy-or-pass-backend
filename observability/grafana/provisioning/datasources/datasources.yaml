# Grafana datasource 자동 등록
#
# 핵심은 단순 등록이 아니라 **상호 연결**이다.
#   트레이스 → 로그   (tracesToLogsV2)
#   트레이스 → 메트릭 (tracesToMetrics)
#   로그 → 트레이스   (derivedFields)
# 이 연결이 있어야 "느린 요청 발견 → 그 요청의 로그 확인" 이 한 클릭이 된다.

apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    jsonData:
      # 트레이스 → 로그. trace_id 로 Loki 를 조회한다.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        filterByTraceID: true
        filterBySpanID: false
      # 트레이스 → 메트릭.
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
      # ServerMap 대체 — service graph 를 그리려면 Prometheus 를 가리켜야 한다.
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      # 스팬에서 바로 RED 지표를 본다.
      spanBar:
        type: Duration
      streamingEnabled:
        search: true

  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      # exemplar = 메트릭 그래프의 점에서 트레이스로 점프한다.
      # Pinpoint 의 scatter chart 드릴다운에 해당한다.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    jsonData:
      # 로그 → 트레이스. 로그 라인에서 trace_id 를 뽑아 Tempo 로 보낸다.
      #
      # 이 프로젝트의 로그 패턴은 다음과 같다(logback-spring.xml):
      #   2026-08-17 17:20:33.398 INFO  [correlationId] [trace_id] [span_id] [thread] logger - msg
      # OTLP 로 들어온 로그는 구조화 메타데이터에 trace_id 가 이미 있으므로
      # 파싱 없이 연결되지만, 파일 경로로 수집할 경우를 대비해 정규식도 둔다.
      derivedFields:
        - name: TraceID
          matcherType: regex
          matcherRegex: '\[([0-9a-f]{32})\]'
          url: '$${__value.raw}'
          datasourceUid: tempo
          urlDisplayLabel: 'Trace 보기'
