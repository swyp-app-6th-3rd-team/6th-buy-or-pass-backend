# 대시보드 자동 로드
#
# /var/lib/grafana/dashboards 아래의 JSON 을 읽는다.
# compose 가 ./grafana/dashboards 를 그 경로에 마운트한다.

apiVersion: 1

providers:
  - name: sakila-dashboards
    orgId: 1
    folder: 'sakila-ddd-template'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
