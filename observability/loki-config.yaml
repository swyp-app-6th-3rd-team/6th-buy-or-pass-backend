# Loki — 로그 저장
#
# 단일 노드 홈서버 구성이다. 클러스터링·객체스토리지를 쓰지 않는다.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # OTLP 로 들어오는 로그의 구조화 메타데이터(trace_id 등)를 저장하려면 필요하다.
  allow_structured_metadata: true
  # 주의: 이 파일은 ${VAR} 를 확장하지 않는다(Loki 가 직접 읽는다).
  # 값을 바꾸려면 여기를 직접 고친다.
  retention_period: 168h   # 7일
  # 홈서버 단일 앱 기준. 여러 앱을 붙이면 올린다.
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
