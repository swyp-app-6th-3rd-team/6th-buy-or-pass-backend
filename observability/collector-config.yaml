# OTel Collector — 앱의 단일 진입점
#
# 앱은 이 주소 하나만 안다. 백엔드를 갈아끼워도 앱 설정이 바뀌지 않는다.
# OTLP 로 한 번 계측하고 백엔드는 자유롭게 교체한다는 것이 OTel 의 요지다.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # 배치 전송. 네트워크 왕복을 줄인다.
  batch:
    timeout: 5s
    send_batch_size: 1024

  # Collector 자신이 OOM 으로 죽는 것을 막는다.
  # 홈서버는 자원이 한정적이라 이 방어가 실질적이다.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  # 앱 메트릭은 Prometheus 가 /actuator/prometheus 를 직접 긁는다(pull).
  # 여기서는 에이전트가 OTLP 로 보낸 메트릭만 remote-write 로 넘긴다.
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    tls:
      insecure: true
    # exemplar = 메트릭에서 트레이스로 점프하는 연결고리
    send_metadata: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]

  telemetry:
    logs:
      level: info
