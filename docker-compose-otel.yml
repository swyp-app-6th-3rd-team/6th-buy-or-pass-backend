# OpenTelemetry 에이전트 부착 — override 파일
#
# 이 파일은 백엔드를 띄우지 않는다. 기존 app 서비스에 에이전트만 얹는다.
# 백엔드는 observability/docker-compose.yml 로 따로 띄운다(여러 앱이 공유).
#
#   # 최초 1회
#   docker network create observability-net
#   docker compose -f observability/docker-compose.yml up -d
#
#   # 앱 — OTel 없이 (기존과 완전히 동일)
#   docker compose -f docker-compose-prod.yml --profile app up -d
#
#   # 앱 — OTel 에이전트 부착
#   docker compose -f docker-compose-prod.yml -f docker-compose-otel.yml --profile app up -d
#
# 왜 override 파일인가:
#   같은 파일 안에서 profiles: 로는 "서비스 추가" 만 되고 "기존 서비스 수정" 이 안 된다.
#   에이전트 부착은 기존 app 서비스에 환경변수·네트워크를 더하는 일이므로
#   override 가 맞는 도구다.

services:
  app:
    build:
      args:
        # 에이전트를 이미지에 포함시킨다. 기본은 false 라 평소엔 흔적이 없다.
        OTEL_ENABLED: "true"
        OTEL_AGENT_VERSION: "${OTEL_AGENT_VERSION:-2.30.0}"

    environment:
      # ENTRYPOINT 가 exec 배열이라 환경변수가 확장되지 않는다.
      # JAVA_TOOL_OPTIONS 는 JVM 이 직접 읽으므로 이 제약을 우회한다.
      JAVA_TOOL_OPTIONS: "-javaagent:/otel/opentelemetry-javaagent.jar"

      # ── OTel 에이전트 설정 ────────────────────────────────────────────
      # ServerMap 의 노드 이름. 같은 앱을 여러 대 띄우면 이 값은 동일해야 한다.
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-sakila-ddd-template}"

      # collector 는 같은 external 네트워크의 서비스명으로 접근한다.
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_ENDPOINT:-http://otel-collector:4318}"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"

      # 트레이스와 로그는 OTLP 로 보낸다.
      # 메트릭은 Prometheus 가 /actuator/prometheus 를 직접 긁으므로(pull) 끈다 —
      # 켜두면 Micrometer 와 OTel 이 같은 지표를 이중 집계한다.
      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_LOGS_EXPORTER: "otlp"
      OTEL_METRICS_EXPORTER: "none"

      # 전수 수집. 낮추면 Tempo service graph 의 엣지 카운트가 과소 집계된다.
      OTEL_TRACES_SAMPLER: "${OTEL_SAMPLER:-parentbased_always_on}"

      # 인스턴스 식별. 여러 대를 띄우면 컨테이너별로 달라야 한다.
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=${DEPLOY_ENV:-prod},service.instance.id=${HOSTNAME:-sakila-01}"

      # 파일 로깅(ADR-0009 자산)을 그대로 두고 OTLP 로도 보낸다.
      # 파일은 사람이 tail 로 읽고, OTLP 는 Grafana 에서 트레이스와 연결한다.
      OTEL_LOGS_EXPORTER_INCLUDE_LOG_ATTRIBUTES: "true"

      # SQL 바인드 값은 기본적으로 켜지 않는다.
      # 이 옵션은 allow-list 가 아니라 sanitization 을 통째로 끄기 때문에
      # 운영에서 위험하다(CVE-2026-54704 계열 노출이 재개방된다).
      # 바인드 값은 org.hibernate.orm.jdbc.bind 로거로 이미 확보된다.
      #   OTEL_INSTRUMENTATION_JDBC_EXPERIMENTAL_CAPTURE_QUERY_PARAMETERS: "true"

    networks:
      # default: 앱 <-> MySQL (기존 compose 의 네트워크)
      - default
      # observability-net: 앱 <-> collector, Prometheus <-> 앱 관리포트
      - observability-net

networks:
  observability-net:
    external: true
    name: observability-net
